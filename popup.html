<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PasteLibrary</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-layout">
    <header>
      <div class="pl-header-brand">
        <svg class="pl-brand-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
        <h1>PasteLibrary</h1>
      </div>
      <div class="pl-header-actions">
        <span id="rateLimitBadge" class="pl-badge" title="GitHub API Rate Limit">API: --/--</span>
        <button id="toggleSettingsBtn" class="pl-icon-btn" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </header>
    <main class="pl-main">
      <!-- Settings Drawer -->
      <div id="settingsDrawer" class="pl-settings-drawer" hidden>
        <div class="pl-setting-row">
          <label for="tokenInput">GitHub Token (Optional)</label>
          <div class="pl-input-group">
            <input type="password" id="tokenInput" placeholder="ghp_... (private repos & higher limits)">
            <button id="saveTokenBtn" type="button">Save</button>
          </div>
        </div>
        <div class="pl-setting-row pl-checkbox-row">
          <label>
            <input type="checkbox" id="autoCopyCheckbox" checked>
            <span>Auto-copy file text on click</span>
          </label>
        </div>
      </div>

      <!-- Repo input bar -->
      <div class="pl-repo-bar">
        <div class="pl-input-group">
          <input type="text" id="repoUrlInput" placeholder="owner/repo or GitHub URL" autocomplete="off" spellcheck="false">
          <button id="loadRepoBtn" class="pl-primary-btn" type="button">Browse</button>
        </div>
        <div id="recentChips" class="pl-chips"></div>
      </div>

      <!-- Breadcrumbs / Navigation -->
      <div class="pl-nav-bar" id="breadcrumbBar" hidden>
        <button id="upDirBtn" class="pl-small-btn" type="button" title="Go up one folder">⬆ Up</button>
        <div id="breadcrumbList" class="pl-breadcrumbs"></div>
        <input type="text" id="fileFilterInput" placeholder="Filter..." class="pl-filter-input">
      </div>

      <!-- Directory Items -->
      <div class="pl-section-header">
        <span class="pl-section-title">Directory Items</span>
        <span id="itemsCountBadge" class="pl-count-badge">0 items</span>
      </div>
      <div id="fileListContainer" class="pl-file-list">
        <div class="pl-empty-state">
          <p>Enter a GitHub repository above to browse files.</p>
        </div>
      </div>

      <!-- Preview Pane -->
      <div class="pl-section-header pl-preview-header">
        <div class="pl-file-meta">
          <span id="activeFileName" class="pl-filename">No file selected</span>
          <span id="activeFileMeta" class="pl-meta"></span>
        </div>
        <div class="pl-preview-actions">
          <button id="openAsFolderBtn" class="pl-small-btn" type="button" title="Open codeblocks as folder" hidden>📂 0</button>
          <button id="highlightAllBtn" class="pl-small-btn" type="button" title="Select all" disabled>Select</button>
          <button id="copyCodeBtn" class="pl-small-btn pl-primary-btn" type="button" title="Copy code" disabled>Copy</button>
        </div>
      </div>
      <div id="codeScrollBox" class="pl-code-box">
        <div class="pl-empty-state">
          <p>Click a text file above to preview and copy its contents.</p>
        </div>
      </div>

      <!-- Toast notification -->
      <p id="plToast" class="notice pl-toast" role="status" hidden></p>
    </main>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
